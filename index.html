    <main>
        <section class="intro">
            <!-- Optional short lede; remove if not needed -->

        <section class="blog">

        <section class="subscribe">
            <h3>Subscribe</h3>
            <form id="subscribe-form" action="#" method="post" novalidate>
                <label for="email" class="sr-only">Email address</label>
                <input id="email" name="email" type="email" placeholder="you@email.com" required>
                <button type="submit" id="submit-btn">Subscribe</button>
                <p id="form-message" role="status" aria-live="polite"></p>
            </form>
            <noscript>
                <p>JavaScript is required to subscribe. You can also follow via RSS above.</p>
            </noscript>
        </section>

    <footer class="site-footer">
        <hr>
        <p>
            <a href="http://validator.w3.org/feed/check.cgi?url=https%3A//travisgraham.co/atom.xml" class="validator">
                <img src="img/valid-atom.png" alt="[Valid Atom 1.0]" title="Validate my Atom 1.0 feed" width="88"
                    height="31">
            </a>
        </p>
        <p class="updated">Last updated: December 14, 2025</p>
    </footer>

    <script>
        (function () {
            const form = document.getElementById('subscribe-form');
            const emailInput = document.getElementById('email');
            const messageBox = document.getElementById('form-message');
            const btn = document.getElementById('submit-btn');
            const webhookUrl = 'https://n8n.travisgraham.co/webhook/5edd1ea6-0130-4229-8240-05479a889267';

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                if (!email) return;

                btn.textContent = 'Sending…';
                btn.disabled = true;
                messageBox.textContent = '';

                try {
                    const res = await fetch(webhookUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    if (!res.ok) throw new Error('Network response was not ok');

                    messageBox.style.color = 'green';
                    messageBox.textContent = 'Thanks for subscribing!';
                    form.reset();
                } catch (err) {
                    console.error(err);
                    messageBox.style.color = 'red';
                    messageBox.textContent = 'Something went wrong. Please try again.';
                } finally {
                    btn.textContent = 'Subscribe';
                    btn.disabled = false;
                }
            });
        }());
    </script>
</body>
